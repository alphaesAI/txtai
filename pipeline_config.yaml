# ETL Pipeline Configuration for txtai
# This file defines the configuration for all ETL pipeline components

# Global settings
settings:
  log_level: INFO
  batch_size: 1000
  max_retries: 3
  timeout: 30

# Connector configurations
connectors:
  postgres:
    type: postgres
    conn_id: "postgres_default"
    echo: false

  elasticsearch:
    type: elasticsearch
    connection_string: "http://localhost:9200"
    use_ssl: false
    verify_certs: true
    timeout: 30
    max_retries: 3
    retry_on_timeout: true

  gmail:
    type: gmail
    credentials_path: "/home/logi/txtai/credentials.json"
    token_path: "/home/logi/txtai/token.json"

# Extractor configurations
extractors:
  postgres:
    type: postgres
    connector: postgres
    batch_size: 1000
    serialize_timestamps: true

  textractor:
    type: textractor
    supported_extensions: [".txt", ".pdf", ".docx", ".xlsx", ".csv", ".json", ".html", ".htm", ".xml", ".rtf", ".odt", ".ods", ".pptx", ".epub", ".md"]
    max_file_size: 100MB
    sentences: false
    paragraphs: true
    sections: false
    cleantext: true
    backend: "available"

# Loader configurations
loaders:
  elasticsearch:
    type: elasticsearch
    connector: elasticsearch
    index_name: "etl_pipeline"
    doc_type: null
    id_field: null
    bulk_size: 1000
    max_retries: 3
    raise_on_error: true

# Transformer configurations
transformers:
  json:
    type: json
    orient: records
    date_format: iso
    handle_nan: null
    include_index: false
    indent: null

# Data processing configurations
data:
  preprocessor:
    connector_type: gmail
    textractor_config:
      extract_files: true
      extract_html: true
      extract_text: true
      output_format: json

  tabular:
    idcolumn: id
    textcolumns: ["content", "description"]
    content: true

  segmentation:
    sentences: true
    paragraphs: false
    max_length: 500
    overlap: 50

# Pipeline definitions
pipelines:
  # PostgreSQL to Elasticsearch pipeline
  postgres_to_es:
    name: "PostgreSQL to Elasticsearch"
    description: "Extract data from PostgreSQL and load into Elasticsearch"
    steps:
      - name: extract
        type: extractor
        config: postgres
      - name: transform
        type: transformer
        config: json
      - name: load
        type: loader
        config: elasticsearch

  # Gmail to Elasticsearch pipeline
  gmail_to_es:
    name: "Gmail to Elasticsearch"
    description: "Extract emails and attachments from Gmail and load into Elasticsearch"
    steps:
      - name: preprocess
        type: preprocessor
        config: gmail
      - name: extract
        type: textractor
        config: default
      - name: transform
        type: transformer
        config: json
      - name: load
        type: loader
        config: elasticsearch

  # Files to Elasticsearch pipeline
  files_to_es:
    extractor: textractor
    transformer: json
    loader: elasticsearch
    description: "Extract text from files and load to Elasticsearch"
    steps:
      - name: extract
        type: extractor
        config: textractor
      - name: process
        type: textractor
        config: default
      - name: segment
        type: segmentation
        config: default
      - name: transform
        type: transformer
        config: json
      - name: load
        type: loader
        config: elasticsearch

# Monitoring and logging
monitoring:
  metrics:
    enabled: true
    endpoint: "http://localhost:8080/metrics"
  
  logging:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "etl_pipeline.log"
    max_size: 10MB
    backup_count: 5

# Environment-specific overrides
environments:
  development:
    settings:
      log_level: DEBUG
    connectors:
      postgres:
        connection_string: "postgresql://dev_user:dev_pass@localhost:5432/dev_db"
      elasticsearch:
        connection_string: "http://localhost:9200"

  production:
    settings:
      log_level: WARNING
      batch_size: 5000
    connectors:
      postgres:
        connection_string: "postgresql://prod_user:prod_pass@prod-db:5432/prod_db"
        pool_size: 20
      elasticsearch:
        connection_string: "https://prod-es.example.com:9200"
        use_ssl: true
        verify_certs: true

  testing:
    settings:
      log_level: DEBUG
      batch_size: 10
    connectors:
      postgres:
        connection_string: "postgresql://test_user:test_pass@localhost:5432/test_db"
      elasticsearch:
        connection_string: "http://localhost:9201"
